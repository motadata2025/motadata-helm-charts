name: Publish motadata-k8s chart

on:
  push:
    tags:
      - 'motadata-k8s-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example, motadata-k8s-0.1.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^motadata-k8s-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Expected a stable release tag such as motadata-k8s-0.1.1'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Validate chart and create checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#motadata-k8s-}"
          package="motadata-k8s-${version}.tgz"
          test -f "$package" || { echo "::error::Missing $package at $RELEASE_TAG"; exit 1; }
          metadata="$(helm show chart "$package")"
          name="$(awk '/^name:/ {print $2}' <<< "$metadata")"
          chart_version="$(awk '/^version:/ {print $2}' <<< "$metadata")"
          if [[ "$name" != motadata-k8s || "$chart_version" != "$version" ]]; then
            echo '::error::Chart name or version does not match the release tag'
            exit 1
          fi
          sha256sum "$package" > "$package.sha256"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          package="${RELEASE_TAG}.tgz"
          # Existing releases fail rather than replacing published chart assets.
          gh release create "$RELEASE_TAG" "$package" "$package.sha256" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "Motadata Kubernetes Helm chart. Download the .tgz asset and its SHA-256 checksum."
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${package}"
          printf 'Download chart: [%s](%s)\n' "$package" "$url" >> "$GITHUB_STEP_SUMMARY"
