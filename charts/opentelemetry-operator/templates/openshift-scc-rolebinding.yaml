{{- if .Values.openshift.enabled }}
{{- if .Values.openshift.securityContextConstraints.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "opentelemetry-operator.fullname" . }}-scc-{{ .Values.openshift.securityContextConstraints.name }}
  labels:
    {{- include "opentelemetry-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.openshift.securityContextConstraints.name }}
subjects:
  - kind: ServiceAccount
    name: {{ template "opentelemetry-operator.serviceAccountName" . }}
    namespace: {{ template "opentelemetry-operator.namespace" . }}
{{- end }}
{{- end }}
