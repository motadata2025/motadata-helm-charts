{{/*
Renders nothing. Exists purely to fail the install early with a readable message
instead of shipping an empty value into the running pods.
*/}}

{{- if not .Values.global.clusterName }}
{{- fail "global.clusterName is required, e.g. --set global.clusterName=k8s" }}
{{- end }}

{{- $obi := index .Values "opentelemetry-ebpf-instrumentation" }}
{{- if and $obi.enabled (not .Values.global.otlpEndpoint) }}
{{- fail "global.otlpEndpoint is required, e.g. --set global.otlpEndpoint=http://172.16.15.146:4318" }}
{{- end }}

{{- $agent := index .Values "motadata-apm-agent" }}
{{- if $agent.enabled }}
{{- if not $agent.env.motadataServerUrl }}
{{- fail "motadata-apm-agent.env.motadataServerUrl is required, e.g. http://172.16.15.52:4318/kubernetes/cluster" }}
{{- end }}
{{- if ne $agent.env.clusterName .Values.global.clusterName }}
{{- fail (printf "motadata-apm-agent.env.clusterName (%q) must equal global.clusterName (%q). The agent chart does not template its values, so this has to be set in both places." $agent.env.clusterName .Values.global.clusterName) }}
{{- end }}
{{- end }}
