apiVersion: v2
name: motadata-ebpf
description: One-shot install of Motadata eBPF APM — OpenTelemetry eBPF Instrumentation (OBI) and the Motadata APM agent.
type: application
version: 0.1.0
appVersion: "1.0"

# file:// against the sibling charts in this repo, same as motadata-k8s: the
# umbrella always ships the subchart revisions from this commit, and CI needs
# no extra chart repository to resolve them.
dependencies:
  - name: opentelemetry-ebpf-instrumentation
    version: 0.13.1
    repository: "file://../opentelemetry-ebpf-instrumentation"
    condition: opentelemetry-ebpf-instrumentation.enabled

  - name: motadata-apm-agent
    version: 0.1.0
    repository: "file://../motadata-apm-agent"
    condition: motadata-apm-agent.enabled
