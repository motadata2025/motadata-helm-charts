apiVersion: v2
name: motadata-k8s
description: One-shot install of the Motadata Kubernetes APM stack — OpenTelemetry operator, Instrumentation CR, and Motadata APM agent.
type: application
version: 0.1.1
appVersion: "1.0"

# Dependencies are file:// against the sibling charts in this repo, not the
# published motadata-charts index. Two reasons:
#   1. No version skew — the umbrella always ships the subchart revisions from
#      this commit, which are the ones it was tested against. (The published
#      index currently serves opentelemetry-operator 0.99.2 while this repo is
#      on 0.102.0.)
#   2. Neither .github/workflows/lint.yaml (ct lint --chart-repos) nor
#      release.yaml (Add dependent repositories) lists the motadata-charts repo,
#      so an HTTPS dependency would fail dependency resolution in CI until
#      someone remembers to add it. file:// needs no repo configuration at all.
dependencies:
  - name: opentelemetry-operator
    version: 0.102.0
    repository: "file://../opentelemetry-operator"
    condition: opentelemetry-operator.enabled

  - name: motadata-apm-agent
    version: 0.1.0
    repository: "file://../motadata-apm-agent"
    condition: motadata-apm-agent.enabled

# NOTE: motadata-cr-instrumentation is deliberately NOT a dependency.
# The Instrumentation CR lives in this chart's templates/ instead, because:
#   1. Helm cannot template values.yaml, and that subchart reads
#      .Values.clusterName / .Values.collectorIp at its own scope rather than
#      .Values.global.*, so a single global input cannot be derived into it.
#   2. The CR must carry a post-install hook annotation to survive the
#      operator's failurePolicy:Fail admission webhook — and a parent chart
#      cannot add annotations to a subchart's resources.
# motadata-cr-instrumentation remains published and usable standalone.
